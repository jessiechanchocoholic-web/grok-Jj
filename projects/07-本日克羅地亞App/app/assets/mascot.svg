<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F3049"/>
      <stop offset="100%" stop-color="#152236"/>
    </linearGradient>
    <pattern id="croatiaCheck" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <rect width="12" height="12" fill="#C33C2E"/>
      <rect x="12" y="12" width="12" height="12" fill="#C33C2E"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1320" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Navy Rounded Square App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Adriatic Wave Accent at Bottom -->
  <path d="M0 420 Q128 395 256 420 T512 420 L512 512 L0 512 Z" fill="#274060" opacity="0.35"/>

  <!-- White Circular Frame (matching 本日東京 icon composition) -->
  <circle cx="256" cy="272" r="176" fill="#FFFEFB" filter="url(#softShadow)"/>
  <circle cx="256" cy="272" r="166" fill="#F7F5F0"/>

  <!-- Cheerful Action Lines (Top Right, red like 本日東京) -->
  <g stroke="#E25A4C" stroke-width="10" stroke-linecap="round">
    <line x1="382" y1="98" x2="404" y2="74"/>
    <line x1="406" y1="122" x2="434" y2="108"/>
    <line x1="412" y1="150" x2="440" y2="146"/>
  </g>

  <!-- Tour Guide Flag (Left Side, held by puppy) -->
  <g transform="translate(56, 128) rotate(-14)">
    <!-- Flag pole -->
    <rect x="44" y="18" width="10" height="190" rx="5" fill="#EDEAE3" stroke="#1F3049" stroke-width="5"/>
    <circle cx="49" cy="16" r="9" fill="#F4B942" stroke="#1F3049" stroke-width="4"/>
    <!-- Triangular Red Flag with Croatian Checkerboard Trim -->
    <path d="M54 24 L158 62 L54 102 Z" fill="#C33C2E" stroke="#1F3049" stroke-width="5" stroke-linejoin="round"/>
    <!-- Small white star/cross accent on flag -->
    <circle cx="84" cy="63" r="10" fill="#FFFEFB"/>
    <rect x="78" y="57" width="6" height="6" fill="#C33C2E"/>
    <rect x="84" y="63" width="6" height="6" fill="#C33C2E"/>
  </g>

  <!-- Dalmatian Puppy Body (Torso) -->
  <path d="M168 345 C168 295 344 295 344 345 L358 430 C300 456 212 456 154 430 Z" fill="#FFFEFB" stroke="#1F3049" stroke-width="8" stroke-linejoin="round"/>
  <!-- Dalmatian Spots on Body -->
  <circle cx="205" cy="392" r="14" fill="#1F3049"/>
  <circle cx="308" cy="386" r="11" fill="#1F3049"/>
  <circle cx="292" cy="414" r="7" fill="#1F3049"/>

  <!-- Croatian Red-White Checkerboard Neckerchief / Scarf -->
  <path d="M172 336 Q256 376 340 336 L326 378 Q256 410 186 378 Z" fill="#C33C2E" stroke="#1F3049" stroke-width="7" stroke-linejoin="round"/>
  <!-- Checkerboard central knot & tails -->
  <rect x="226" y="352" width="60" height="36" rx="10" fill="url(#croatiaCheck)" stroke="#1F3049" stroke-width="6"/>
  <path d="M238 386 L222 428 L252 422 Z" fill="#C33C2E" stroke="#1F3049" stroke-width="6" stroke-linejoin="round"/>
  <path d="M274 386 L290 428 L260 422 Z" fill="#C33C2E" stroke="#1F3049" stroke-width="6" stroke-linejoin="round"/>

  <!-- Dalmatian Puppy Head -->
  <!-- Floppy Ears (Black & Spotted) -->
  <path d="M158 195 C115 200 102 268 126 300 C144 320 168 296 172 260 Z" fill="#1F3049" stroke="#1F3049" stroke-width="6" stroke-linejoin="round"/>
  <path d="M354 195 C397 200 410 268 386 300 C368 320 344 296 340 260 Z" fill="#FFFEFB" stroke="#1F3049" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="374" cy="248" r="15" fill="#1F3049"/>
  <circle cx="364" cy="280" r="10" fill="#1F3049"/>

  <!-- Main Head Shape -->
  <rect x="148" y="162" width="216" height="186" rx="92" fill="#FFFEFB" stroke="#1F3049" stroke-width="8"/>

  <!-- Cute Dalmatian Patch over Left Eye -->
  <ellipse cx="204" cy="242" rx="34" ry="30" transform="rotate(-12 204 242)" fill="#1F3049"/>
  <!-- Small Dalmatian Spots on Forehead/Cheek -->
  <circle cx="318" cy="206" r="11" fill="#1F3049"/>
  <circle cx="332" cy="228" r="7" fill="#1F3049"/>

  <!-- Straw Hat (Tour Guide Hat with Adriatic Blue Ribbon) -->
  <g transform="translate(0, -8)">
    <!-- Hat Brim -->
    <ellipse cx="256" cy="172" rx="134" ry="34" fill="#F5C451" stroke="#1F3049" stroke-width="8"/>
    <!-- Hat Crown -->
    <path d="M168 166 C168 102 344 102 344 166 Z" fill="#FAD46B" stroke="#1F3049" stroke-width="8" stroke-linejoin="round"/>
    <!-- Adriatic Blue Ribbon Band -->
    <path d="M170 154 Q256 174 342 154 L344 168 Q256 188 168 168 Z" fill="#1F5A9E" stroke="#1F3049" stroke-width="6" stroke-linejoin="round"/>
    <!-- Small Croatian Checkerboard Badge on Hat -->
    <rect x="242" y="146" width="28" height="24" rx="5" fill="url(#croatiaCheck)" stroke="#1F3049" stroke-width="4"/>
  </g>

  <!-- Eyes (Bright & Sparkly) -->
  <circle cx="206" cy="246" r="14" fill="#FFFEFB"/>
  <circle cx="206" cy="246" r="11" fill="#1F3049"/>
  <circle cx="202" cy="241" r="4.5" fill="#FFFEFB"/>

  <circle cx="306" cy="246" r="12" fill="#1F3049"/>
  <circle cx="302" cy="241" r="4.5" fill="#FFFEFB"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="176" cy="274" rx="15" ry="9" fill="#F28B82" opacity="0.75"/>
  <ellipse cx="336" cy="274" rx="15" ry="9" fill="#F28B82" opacity="0.75"/>

  <!-- Cute Dog Nose & Big Cheerful Open Smile -->
  <ellipse cx="256" cy="262" rx="15" ry="11" fill="#1F3049"/>
  <ellipse cx="252" cy="259" rx="5" ry="3" fill="#5C708B"/>
  <path d="M236 278 Q256 290 276 278" fill="none" stroke="#1F3049" stroke-width="6" stroke-linecap="round"/>
  <path d="M234 280 C234 316 278 316 278 280 Z" fill="#C33C2E" stroke="#1F3049" stroke-width="6" stroke-linejoin="round"/>
  <path d="M242 296 Q256 288 270 296 C268 310 244 310 242 296 Z" fill="#F48FB1"/>

  <!-- Left Paw holding the flag -->
  <ellipse cx="136" cy="316" rx="26" ry="22" transform="rotate(-20 136 316)" fill="#FFFEFB" stroke="#1F3049" stroke-width="8"/>
  <circle cx="132" cy="312" r="5" fill="#1F3049"/>

  <!-- Right Paw Waving Cheerfully -->
  <g transform="translate(376, 296) rotate(28)">
    <ellipse cx="0" cy="0" rx="24" ry="32" fill="#FFFEFB" stroke="#1F3049" stroke-width="8"/>
    <circle cx="-6" cy="-12" r="4.5" fill="#F28B82"/>
    <circle cx="6" cy="-12" r="4.5" fill="#F28B82"/>
    <ellipse cx="0" cy="2" rx="7" ry="6" fill="#F28B82"/>
  </g>
</svg>