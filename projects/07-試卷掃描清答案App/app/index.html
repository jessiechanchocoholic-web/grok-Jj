<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>掃描清答案王</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="掃描清答案" />
  <link rel="manifest" href="./manifest.json?v=3.1" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3.1" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3.1" />
  <link rel="stylesheet" href="./style.css?v=3.1" />
</head>
<body>
  <!-- Off-screen Native File Inputs (NO hidden attribute so iOS Safari <label for="..."> always works) -->
  <input type="file" id="cameraFallbackInput" class="sr-file-input" accept="image/*" capture="environment" multiple />
  <input type="file" id="importFilesInput" class="sr-file-input" accept="image/*,.pdf,application/pdf" multiple />

  <!-- Toast Notification -->
  <div id="statusToast" class="status-toast" role="status" aria-live="polite"></div>

  <!-- ===================================================================== -->
  <!-- SCREEN A1: CamScanner 首頁 ＝「我的試卷文檔庫」                        -->
  <!-- ===================================================================== -->
  <section id="screenHome" class="app-screen active">
    <header class="top-bar">
      <div class="top-brand">
        <img src="./icon.svg?v=3.1" alt="" class="top-logo" />
        <span class="top-title">📁 我的試卷庫</span>
        <span id="docCountBadge" class="top-badge">0 份</span>
      </div>
      <button type="button" id="btnQuickDemo" class="top-mini-btn">✨ 載入示範卷</button>
    </header>

    <main id="docListContainer" class="doc-list-area">
      <!-- Empty State (Shown when 0 docs) -->
      <div id="homeEmptyState" class="home-empty">
        <div class="empty-icon">📷</div>
        <div class="empty-title">撳下方「連續快拍」或「匯入相簿/PDF」開始</div>
      </div>
      <!-- Document List Cards -->
      <div id="docList" class="doc-list"></div>
    </main>

    <footer class="home-bottom-dock">
      <button type="button" id="btnStartCamera" class="cta-giant cta-camera">
        <span class="cta-ico">📷</span>
        <span>連續快拍</span>
      </button>
      <label for="importFilesInput" id="btnImportFiles" class="cta-giant cta-import" role="button" tabindex="0">
        <span class="cta-ico">📄</span>
        <span>匯入相簿 / 舊 PDF</span>
      </label>
    </footer>
  </section>

  <!-- ===================================================================== -->
  <!-- SCREEN A2: 全螢幕「連續快拍」模式 (CamScanner Camera Page)             -->
  <!-- ===================================================================== -->
  <section id="screenCamera" class="app-screen">
    <header class="cam-top-bar">
      <button type="button" id="btnCloseCamera" class="cam-nav-btn">✕ 返回</button>
      <span class="cam-title">📷 連續快拍</span>
      <label for="cameraFallbackInput" id="btnNativeCamFallback" class="cam-nav-btn" role="button" tabindex="0">系統相機</label>
    </header>

    <div id="camViewfinder" class="cam-viewfinder">
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camSimCanvas" class="cam-sim-canvas"></canvas>
      <div class="cam-a4-guide"></div>
      <label for="cameraFallbackInput" id="btnCamFallbackBig" class="cam-fallback-cta" role="button" tabindex="0">
        📷 直接開啟手機相機拍照
      </label>
      <div id="camFlash" class="cam-flash"></div>
    </div>

    <footer class="cam-bottom-bar">
      <label for="importFilesInput" id="btnCamImport" class="cam-side-btn" role="button" tabindex="0">
        <span class="cam-side-ico">🖼️</span>
        <span>相簿/PDF</span>
      </label>

      <button type="button" id="btnShutter" class="shutter-btn" aria-label="快門拍照">
        <span class="shutter-inner"></span>
      </button>

      <button type="button" id="btnCameraDone" class="cam-done-btn">
        <img id="camThumbImg" class="cam-thumb-img" alt="" hidden />
        <span id="camSnapBadge" class="cam-snap-badge">0</span>
        <span>完成 (<span id="camSnapCount">0</span>張) ➔</span>
      </button>
    </footer>
  </section>

  <!-- ===================================================================== -->
  <!-- SCREEN B: 全螢幕大圖預覽＋底部極簡圖示工具列 (CamScanner Editor)       -->
  <!-- ===================================================================== -->
  <section id="screenEditor" class="app-screen">
    <!-- Top 40px Minimal Nav Bar -->
    <header id="editorTopBar" class="editor-top-bar">
      <div class="nav-left">
        <button type="button" id="btnBackToHome" class="nav-pill">⬅ 文檔庫</button>
        <button type="button" id="btnAddMorePages" class="nav-pill">➕ 加頁</button>
      </div>

      <div class="nav-center">
        <button type="button" id="btnPrevPage" class="page-arrow" aria-label="上一頁">◀</button>
        <span id="pageCounterText" class="page-counter">第 1 / 1 頁</span>
        <button type="button" id="btnNextPage" class="page-arrow" aria-label="下一頁">▶</button>
      </div>

      <div class="nav-right">
        <button type="button" id="btnDeletePage" class="nav-pill danger">🗑️ 刪頁</button>
      </div>
    </header>

    <!-- 75%–80%+ Full-Screen Exam Paper Stage -->
    <div id="stageArea" class="stage-area">
      <canvas id="editorCanvas"></canvas>

      <!-- Top-left floating mini pill: Header Name Privacy Mask toggle -->
      <button type="button" id="btnToggleHeaderMask" class="floating-pill left-pill active">
        🛡️ 遮頂部名: 開
      </button>

      <!-- Top-right floating mini pill: Hold to view Original -->
      <button type="button" id="btnCompareOrig" class="floating-pill right-pill">
        👁️ 按住睇原圖
      </button>

      <!-- Floating Manual Touch Draw Sub-Toolbar (Hidden unless 🖌️ 手動塗改 is active) -->
      <div id="drawFloatingBar" class="draw-floating-bar" hidden>
        <button type="button" id="toolRect" class="draw-sub-btn active">⬜ 拉白框</button>
        <button type="button" id="toolBrush" class="draw-sub-btn">🖌️ 塗改筆</button>
        <button type="button" id="toolLine" class="draw-sub-btn">📏 補橫線</button>
        <button type="button" id="toolMaskbar" class="draw-sub-btn">🏷️ 遮名條</button>
        <button type="button" id="btnUndoStroke" class="draw-sub-btn">↩️ 復原</button>
      </div>

      <!-- 4-Corner Perspective Crop Overlay (Hidden unless ✂️ 裁切拉直 is clicked) -->
      <div id="cropOverlay" class="crop-overlay" hidden>
        <svg id="cropSvg" class="crop-svg" preserveAspectRatio="none">
          <polygon id="cropPoly" points="0,0 100,0 100,100 0,100"></polygon>
        </svg>
        <div id="cropCorner0" class="crop-handle" data-corner="0"></div>
        <div id="cropCorner1" class="crop-handle" data-corner="1"></div>
        <div id="cropCorner2" class="crop-handle" data-corner="2"></div>
        <div id="cropCorner3" class="crop-handle" data-corner="3"></div>

        <div class="crop-action-bar">
          <button type="button" id="btnCropAuto" class="crop-act-btn">📐 自動邊緣</button>
          <button type="button" id="btnCropFull" class="crop-act-btn">⬜ 鋪滿全頁</button>
          <button type="button" id="btnCropCancel" class="crop-act-btn cancel">✕ 取消</button>
          <button type="button" id="btnCropApply" class="crop-act-btn confirm">✔ 確認裁切</button>
        </div>
      </div>
    </div>

    <!-- Bottom Minimal Icon Strip + Green Export Button -->
    <footer id="editorBottomDock" class="editor-bottom-dock">
      <div class="filter-tool-strip">
        <button type="button" id="fltOriginal" class="strip-btn" data-filter="original">
          <span class="s-ico">📷</span>
          <span class="s-txt">原圖</span>
        </button>
        <button type="button" id="fltMagicColor" class="strip-btn" data-filter="magicColor">
          <span class="s-ico">🪄</span>
          <span class="s-txt">增亮魔術色</span>
        </button>
        <button type="button" id="fltBw" class="strip-btn" data-filter="bw">
          <span class="s-ico">✨</span>
          <span class="s-txt">高清黑白</span>
        </button>
        <button type="button" id="fltCleanAnswer" class="strip-btn active" data-filter="cleanAnswer">
          <span class="s-ico">🧹</span>
          <span class="s-txt">自動清答案</span>
        </button>
        <button type="button" id="btnOpenCrop" class="strip-btn">
          <span class="s-ico">✂️</span>
          <span class="s-txt">裁切拉直</span>
        </button>
        <button type="button" id="btnToggleDraw" class="strip-btn">
          <span class="s-ico">🖌️</span>
          <span class="s-txt">手動塗改</span>
        </button>
        <button type="button" id="btnRotate" class="strip-btn">
          <span class="s-ico">🔄</span>
          <span class="s-txt">旋轉</span>
        </button>
      </div>

      <button type="button" id="btnOpenExportSheet" class="export-main-btn">
        📤 匯出 / 傳送 PDF
      </button>
    </footer>
  </section>

  <!-- ===================================================================== -->
  <!-- BOTTOM SHEET: 匯出 / 傳送 PDF (Web Share + 直接預覽 + 下載提示)         -->
  <!-- ===================================================================== -->
  <div id="exportSheetBackdrop" class="sheet-backdrop" hidden>
    <div id="exportSheet" class="bottom-sheet" role="dialog" aria-label="匯出或傳送 PDF">
      <div class="sheet-header">
        <input type="text" id="inpDocTitle" class="sheet-title-input" aria-label="試卷檔案名稱" />
        <button type="button" id="btnCloseExportSheet" class="sheet-close-btn">✕</button>
      </div>

      <div class="version-tabs">
        <button type="button" id="verCleaned" class="ver-tab active" data-ver="cleaned">
          ✨ 已清答案版 PDF
        </button>
        <button type="button" id="verOriginal" class="ver-tab" data-ver="original">
          📷 Original 原圖版 PDF
        </button>
        <button type="button" id="verBoth" class="ver-tab" data-ver="both">
          ⚡ 兩份一齊（清答案＋原圖）
        </button>
      </div>

      <div class="sheet-actions">
        <button type="button" id="btnSharePdf" class="sheet-big-btn share-primary">
          📲 直接傳去 WhatsApp / AirDrop / 儲存到手機（最推薦！）
        </button>
        <button type="button" id="btnPreviewPdf" class="sheet-big-btn preview-secondary">
          📖 直接喺畫面打開 PDF 預覽（可即印／右上角分享）
        </button>
        <button type="button" id="btnDownloadPdfFile" class="sheet-big-btn download-tertiary">
          ⬇️ 下載檔案落手機
        </button>
      </div>

      <div id="downloadWhereHint" class="download-where-hint">
        📱 iPhone 請撳網址列隔離藍色「↓」圖示開返檔案；Android 請去「下載項目」搵
      </div>
    </div>
  </div>

  <!-- In-App Full-Screen PDF Viewer Modal (for 📖 直接喺畫面打開 PDF 預覽) -->
  <div id="pdfViewerModal" class="pdf-viewer-modal" hidden>
    <header class="pdf-viewer-bar">
      <button type="button" id="btnClosePdfViewer" class="cam-nav-btn">⬅ 返回試卷</button>
      <span id="pdfViewerTitle" class="cam-title">PDF 預覽</span>
      <div style="display:flex;gap:6px;">
        <button type="button" id="btnPrintFromViewer" class="cam-nav-btn">🖨️ 列印</button>
        <a id="lnkOpenPdfNewTab" href="#" target="_blank" rel="noopener" class="cam-nav-btn" style="text-decoration:none;">↗ 新分頁</a>
      </div>
    </header>
    <iframe id="pdfViewerFrame" class="pdf-viewer-frame" title="PDF 預覽"></iframe>
  </div>

  <!-- Rename Document Modal (Inline Minimal Dialog) -->
  <div id="renameModalBackdrop" class="sheet-backdrop" hidden>
    <div class="rename-dialog" role="dialog" aria-label="修改文檔名稱">
      <div class="rename-title">✏️ 修改試卷名稱</div>
      <input type="text" id="inpRenameDoc" class="sheet-title-input" />
      <div class="rename-btns">
        <button type="button" id="btnCancelRename" class="crop-act-btn cancel">取消</button>
        <button type="button" id="btnConfirmRename" class="crop-act-btn confirm">儲存</button>
      </div>
    </div>
  </div>

  <!-- Print Container -->
  <div id="printContainer"></div>

  <!-- Local Scripts (with ?v=3.1 cache-busting) -->
  <script src="./vendor/pdf.min.js?v=3.1"></script>
  <script src="./pdf-lib.js?v=3.1"></script>
  <script src="./demo-sheet.js?v=3.1"></script>
  <script src="./processor.js?v=3.1"></script>
  <script src="./app.js?v=3.1"></script>
</body>
</html>
